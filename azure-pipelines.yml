trigger:
  - main

pool:
  name: 'self-host'  # Usa el agente self-hosted en Arch Linux

variables:
  - group: AWS-Credentials  # Usa las credenciales de AWS

stages:
  - stage: Terraform_Deploy
    displayName: "Desplegar Infraestructura en AWS"
    jobs:
      - job: Terraform
        displayName: "Ejecutar Terraform en Arch Linux"
        steps:
          - checkout: self

          - script: |
              echo "⚡ Instalando dependencias necesarias en Arch Linux..."
              sudo pacman -Syu --noconfirm unzip curl jq aws-cli terraform
            displayName: "Instalar dependencias (Terraform, AWS CLI, etc.)"

          - script: |
              echo "⚡ Configurando AWS CLI..."
              aws configure set aws_access_key_id $(AWS_ACCESS_KEY_ID)
              aws configure set aws_secret_access_key $(AWS_SECRET_ACCESS_KEY)
              aws configure set region $(AWS_REGION)
            displayName: "Configurar AWS CLI"

          - script: |
              echo "⚡ Inicializando Terraform..."
              terraform init
            displayName: "Terraform Init"

          - script: |
              echo "⚡ Validando configuración de Terraform..."
              terraform validate
            displayName: "Terraform Validate"

          - script: |
              echo "⚡ Creando plan de ejecución..."
              terraform plan -out=tfplan
            displayName: "Terraform Plan"

          - script: |
              echo "⚡ Aplicando Terraform..."
              terraform apply -auto-approve
            displayName: "Terraform Apply"

  - stage: SonarQube_Deploy
    displayName: "Verificar SonarQube"
    dependsOn: Terraform_Deploy
    jobs:
      - job: Check_SonarQube
        displayName: "Verificar que SonarQube esté corriendo"
        steps:
          - script: |
              echo "⌛ Esperando 2 minutos para que la instancia esté lista..."
              sleep 120

              echo "🔍 Obteniendo IP pública..."
              SONARQUBE_IP=$(terraform output -raw sonarqube_ip)
              echo "🌍 SonarQube debería estar accesible en http://$SONARQUBE_IP:9000"
            displayName: "Verificar SonarQube"
