trigger:
  - master

pool:
  name: 'self-host'  # Usa el agente self-hosted en Arch Linux

variables:
  - group: AWS-Credentials  # Usa las credenciales de AWS

stages:
  - stage: Terraform_Deploy
    displayName: "Desplegar Infraestructura en AWS"
    jobs:
      - job: Terraform
        displayName: "Ejecutar Terraform en Arch Linux"
        steps:
          - checkout: self

          - script: |
              echo "📂 Creando carpeta terraform si no existe..."
              mkdir -p $(Build.SourcesDirectory)/terraform
              cd $(Build.SourcesDirectory)/terraform
            displayName: "Asegurar carpeta Terraform"

          - script: |
              echo "⚡ Instalando dependencias necesarias en Arch Linux..."
              sudo pacman -Syu --noconfirm unzip curl jq aws-cli terraform
            displayName: "Instalar dependencias (Terraform, AWS CLI, etc.)"

          - script: |
              echo "⚡ Configurando AWS CLI..."
              aws configure set aws_access_key_id $(AWS_ACCESS_KEY_ID)
              aws configure set aws_secret_access_key $(AWS_SECRET_ACCESS_KEY)
              aws configure set region $(AWS_REGION)
            displayName: "Configurar AWS CLI"

          - script: |
              cd $(Build.SourcesDirectory)/terraform
              echo "⚡ Inicializando Terraform..."
              terraform init
            displayName: "Terraform Init"

          - script: |
              cd $(Build.SourcesDirectory)/terraform
              echo "⚡ Validando configuración de Terraform..."
              terraform validate
            displayName: "Terraform Validate"

          - script: |
              cd $(Build.SourcesDirectory)/terraform
              echo "⚡ Creando plan de ejecución..."
              terraform plan -out=tfplan
            displayName: "Terraform Plan"

          - script: |
              cd $(Build.SourcesDirectory)/terraform
              echo "⚡ Aplicando Terraform..."
              terraform apply -auto-approve tfplan
            displayName: "Terraform Apply"

          - script: |
              cd $(Build.SourcesDirectory)/terraform
              echo "📦 Guardando estado de Terraform..."
              cp terraform.tfstate terraform.tfstate.backup
            displayName: "Guardar Backup de Terraform State"

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.SourcesDirectory)/terraform'
              artifact: 'terraform-state'
            displayName: "Publicar estado de Terraform"


  - stage: SonarQube_Deploy
    displayName: "Verificar SonarQube"
    dependsOn: Terraform_Deploy
    jobs:
      - job: Check_SonarQube
        displayName: "Verificar que SonarQube esté corriendo"
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: 'terraform-state'
              targetPath: '$(System.ArtifactsDirectory)/terraform'
            displayName: "📥 Descargar estado de Terraform"

          - script: |
              cd $(System.ArtifactsDirectory)/terraform
              echo "⌛ Esperando 2 minutos para que la instancia esté lista..."
              sleep 120

              echo "🔍 Intentando obtener la IP pública de SonarQube desde Terraform..."
              SONARQUBE_IP=$(terraform output -raw sonarqube_ip 2>/dev/null)

              if [ -z "$SONARQUBE_IP" ]; then
                echo "❌ ERROR: No se pudo obtener la IP pública desde Terraform."
                exit 1
              fi

              echo "🌍 SonarQube debería estar accesible en http://$SONARQUBE_IP:9000"
            displayName: "Verificar SonarQube"
