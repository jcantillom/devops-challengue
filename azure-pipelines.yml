trigger:
  - trunk

pool:
  name: 'hosted-pool'

variables:
  - group: AWS-Credentials

stages:
  - stage: Terraform_Deploy
    displayName: "Desplegar Infraestructura en AWS"
    jobs:
      - job: Terraform
        displayName: "Ejecutar Terraform en Arch Linux"
        steps:
          - checkout: self

          - script: |
              echo "📂 Verificando directorios en el workspace..."
              ls -la $(Build.SourcesDirectory)
              echo "📂 Verificando archivos .tf en el directorio del repositorio:"
              ls -la $(Build.SourcesDirectory)
            displayName: "Verificar directorios y archivos"

          - script: |
              echo "⚡ Instalando dependencias necesarias en Arch Linux..."
              sudo pacman -Syu --noconfirm unzip curl jq aws-cli terraform
            displayName: "Instalar dependencias (Terraform, AWS CLI, etc.)"

          - script: |
              echo "🔄 Eliminando caché de Terraform..."
              rm -rf .terraform/ terraform.tfstate* terraform.lock.hcl

              echo "🔄 Inicializando Terraform con actualización de proveedores..."
              terraform init -upgrade

              echo "🔄 Corrigiendo permisos de los proveedores..."
              find .terraform/providers/ -type f -name "terraform-provider-aws*" -exec chmod +x {} \;

              echo "✅ Terraform ha sido inicializado correctamente."
            displayName: "Inicializar Terraform"


          - script: |
              cd $(Build.SourcesDirectory)
              echo "⚡ Validando configuración de Terraform..."
              terraform validate
            displayName: "Terraform Validate"

          - script: |
              cd $(Build.SourcesDirectory)
              echo "⚡ Creando plan de ejecución..."
              terraform plan -out=tfplan
            displayName: "Terraform Plan"

          - script: |
              cd $(Build.SourcesDirectory)
              echo "⚡ Aplicando Terraform..."
              terraform apply -auto-approve tfplan
            displayName: "Terraform Apply"

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.SourcesDirectory)'
              artifact: 'terraform-state'
            displayName: "Publicar estado de Terraform"



  - stage: SonarQube_Deploy
    displayName: "Verificar SonarQube"
    dependsOn: Terraform_Deploy
    jobs:
      - job: Check_SonarQube
        displayName: "Verificar que SonarQube esté corriendo"
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: 'terraform-state'
              targetPath: '$(System.ArtifactsDirectory)/terraform'
            displayName: "📥 Descargar estado de Terraform"

          - script: |
              cd $(System.ArtifactsDirectory)/terraform
              echo "⌛ Esperando 2 minutos para que la instancia esté lista..."
              sleep 120
              echo "🔄 Refrescando el estado de Terraform..."
              terraform refresh

              echo "🔍 obteniendo la IP pública de SonarQube desde Terraform..."
              SONARQUBE_IP=$(terraform output -raw sonarqube_ip | tr -d '"')

              echo "🌍 SonarQube debería estar accesible en http://$SONARQUBE_IP:9000"
            displayName: "Verificar SonarQube"
